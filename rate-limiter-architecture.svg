<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a6ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="redis" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
  <linearGradient id="api" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <style>
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    .flow{stroke-dasharray:10 9;animation:dash 1.2s linear infinite}
    @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-38}}
  </style>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<text x="600" y="40" text-anchor="middle" fill="#e6edf3" font-family="Arial" font-size="22" font-weight="700">DISTRIBUTED RATE LIMITER • 3D SYSTEM FLOW</text>
<text x="600" y="64" text-anchor="middle" fill="#8b949e" font-family="Arial" font-size="12">Request → API → Redis → Decision → Response</text>

<g font-family="Arial">
  <path class="flow" d="M205 175 H335" stroke="#58a6ff" stroke-width="5" fill="none"/>
  <path class="flow" d="M485 175 H615" stroke="#a78bfa" stroke-width="5" fill="none"/>
  <path class="flow" d="M765 175 H895" stroke="#ef4444" stroke-width="5" fill="none"/>
  <path class="flow" d="M965 235 C965 290 780 310 600 310 C420 310 235 290 235 235" stroke="#4ade80" stroke-width="4" fill="none"/>

  <g class="pulse">
    <path d="M65 145 L135 110 L205 145 L135 180 Z" fill="url(#node)"/>
    <path d="M65 145 L135 180 L135 235 L65 200 Z" fill="#1d4ed8"/>
    <path d="M135 180 L205 145 L205 200 L135 235 Z" fill="#1e40af"/>
    <text x="135" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="700">CLIENT</text>
    <text x="135" y="265" text-anchor="middle" fill="#8b949e" font-size="11">Incoming request</text>
  </g>

  <g class="pulse" style="animation-delay:.4s">
    <path d="M345 145 L415 110 L485 145 L415 180 Z" fill="url(#api)"/>
    <path d="M345 145 L415 180 L415 235 L345 200 Z" fill="#6d28d9"/>
    <path d="M415 180 L485 145 L485 200 L415 235 Z" fill="#5b21b6"/>
    <text x="415" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="700">API</text>
    <text x="415" y="265" text-anchor="middle" fill="#8b949e" font-size="11">Auth + rate check</text>
  </g>

  <g class="pulse" style="animation-delay:.8s">
    <path d="M625 145 L695 110 L765 145 L695 180 Z" fill="url(#redis)"/>
    <path d="M625 145 L695 180 L695 235 L625 200 Z" fill="#b91c1c"/>
    <path d="M695 180 L765 145 L765 200 L695 235 Z" fill="#991b1b"/>
    <text x="695" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="700">REDIS</text>
    <text x="695" y="265" text-anchor="middle" fill="#8b949e" font-size="11">Shared counters</text>
  </g>

  <g class="pulse" style="animation-delay:1.2s">
    <path d="M905 145 L975 110 L1045 145 L975 180 Z" fill="#22c55e"/>
    <path d="M905 145 L975 180 L975 235 L905 200 Z" fill="#15803d"/>
    <path d="M975 180 L1045 145 L1045 200 L975 235 Z" fill="#166534"/>
    <text x="975" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="700">DECISION</text>
    <text x="975" y="265" text-anchor="middle" fill="#8b949e" font-size="11">Allow / reject</text>
  </g>

  <circle cx="600" cy="310" r="6" fill="#58a6ff"/>
  <text x="600" y="338" text-anchor="middle" fill="#58a6ff" font-size="11">Distributed state stays consistent across instances</text>
</g>
</svg>